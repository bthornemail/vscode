version: '3.8'

services:
  ai-persistence:
    build:
      context: ../../packages/autonomous-identity
      dockerfile: Dockerfile.working
    container_name: axiomatic-ai-persistence
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - H2GNN_STORAGE_PATH=/app/persistence
      - H2GNN_STATE_FILE=/app/state/state.json
      - H2GNN_LOG_LEVEL=info
      - H2GNN_MAX_MEMORIES=10000
      - H2GNN_ENCRYPTION_KEY=${H2GNN_ENCRYPTION_KEY:-$(openssl rand -hex 32)}
    volumes:
      - ai_persistence_data:/app/persistence
      - ai_persistence_state:/app/state
      - ai_persistence_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: axiomatic-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-persistence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ai_persistence_data:
    driver: local
  ai_persistence_state:
    driver: local
  ai_persistence_logs:
    driver: local
